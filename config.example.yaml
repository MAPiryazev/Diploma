ledger_db:
  host: localhost
  port: 5432
  user: ledger_app
  password: change-me-ledger
  name: salestracker_ledger
  sslmode: disable

analytics_db:
  host: localhost
  port: 5432
  user: analytics_app
  password: change-me-analytics
  name: salestracker_analytics
  sslmode: disable

server:
  port: 8080
  read_timeout: 10
  write_timeout: 10

app:
  env: development
  log_level: debug

kafka:
  brokers:
    - localhost:9094
  topic: transactions.events
  dlq_topic: transactions.events.dlq
  consumer_group_id: diploma-projection-builder

consumer:
  metrics_port: 2112

security:
  jwt_secret: replace-with-long-random-jwt-secret
  jwt_ttl: 1h
  # Optional legacy fallback for local/dev migration only.
  auth_tokens:
    - token: replace-with-long-random-token
      user_id: 11111111-1111-1111-1111-111111111111
      role: operator

monitoring:
  large_amount_threshold: 100000
