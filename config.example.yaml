postgres:
  host: localhost
  port: 5432
  user: postgres
  password: change-me
  name: salestracker
  sslmode: disable

server:
  port: 8080
  read_timeout: 10
  write_timeout: 10

app:
  env: development
  log_level: debug

kafka:
  brokers:
    - localhost:9094
  topic: transactions.events
  dlq_topic: transactions.events.dlq
  consumer_group_id: diploma-transactions-consumer

consumer:
  metrics_port: 2112

security:
  auth_tokens:
    - token: replace-with-long-random-token
      user_id: 11111111-1111-1111-1111-111111111111
      role: operator

monitoring:
  large_amount_threshold: 100000
