global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: transaction-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - transaction-api:8080

  - job_name: analytics-query
    metrics_path: /metrics
    static_configs:
      - targets:
          - analytics-query:8082

  - job_name: outbox-relay
    metrics_path: /metrics
    static_configs:
      - targets:
          - outbox-relay:8083

  - job_name: projection-builder
    metrics_path: /metrics
    static_configs:
      - targets:
          - projection-builder:2112

  - job_name: risk-evaluation
    metrics_path: /metrics
    static_configs:
      - targets:
          - risk-evaluation:2113

  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308
