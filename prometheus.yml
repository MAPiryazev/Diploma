global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: diploma-app
    metrics_path: /metrics
    static_configs:
      - targets:
          # Тот же Docker network, что и у приложения (см. docker-compose)
          - app:8080

  - job_name: diploma-kafka-consumer
    metrics_path: /metrics
    static_configs:
      - targets:
          - consumer:2112

  # danielqsj/kafka-exporter: lag consumer groups, offsets (см. docker-compose)
  - job_name: kafka-exporter
    static_configs:
      - targets:
          - kafka-exporter:9308
