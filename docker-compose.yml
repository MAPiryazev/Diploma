services:
  app:
    build: .
    container_name: diploma_app
    # Снаружи 8081, чтобы не конфликтовать с локальным `make run` на :8080
    ports:
      - "${APP_HTTP_PORT:-8081}:8080"
    env_file:
      - environment/.env
    environment:
      # Внутри сети compose — сервис БД, порт 5432
      POSTGRES_HOST: L3.6_db
      POSTGRES_PORT: "5432"
    depends_on:
      L3.6_db:
        condition: service_healthy

  L3.6_db:
    image: postgres:16-alpine
    container_name: L3.6_db
    env_file:
      - environment/.env
    ports:
      - "${POSTGRES_HOST_PORT:-28436}:5432"
    volumes:
      - L3_6_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: diploma_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: diploma_grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  L3_6_pgdata:
